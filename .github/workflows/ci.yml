name: Backend CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './backend[test]'
      - run: python -m pytest backend/tests -q
      - run: python -m pip install 'ruff==0.17.6'
      - run: python -m ruff check backend

  scientific-integration:
    name: Stim and PyMatching reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c backend/integration_tests/constraints.txt -e './backend[test,simulation]'
      - run: python -m pytest backend/integration_tests -q

  dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c backend/integration_tests/constraints.txt -e './backend[test,simulation]'
      - run: python -m pip check
      - run: python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/backend-dependencies.txt"
      - run: python -m pip install 'pip-audit==2.10.1'
      - run: python -m pip_audit --strict --no-deps -r "${RUNNER_TEMP}/backend-dependencies.txt"
