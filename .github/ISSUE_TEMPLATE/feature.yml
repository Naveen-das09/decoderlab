name: Feature / research increment
description: One verifiable product or scientific vertical slice
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: What problem does this solve for a researcher?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include observable behavior, tests, charts and data provenance.
    validations:
      required: true
  - type: textarea
    id: scientific
    attributes:
      label: Scientific, security, and accessibility considerations
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
